name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Native builds emit host code and link with the host linker (`cc`,
    # or MSVC's link.exe on Windows), so each target needs its own runner:
    # x86-64 and AArch64 Linux, AArch64 macOS, x86-64 Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The conformance oracle: the corpus is written against CPython 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  memcheck:
    # Use-after-free and lost blocks in native programs; valgrind covers
    # Linux x86-64, the leak count in the debug runtime covers the rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked --test conformance corpus_matches_native
        env:
          PYTHRUST_VALGRIND: "1"
      - run: cargo test --locked --test interop every_type_runs_clean_under_memcheck
        env:
          PYTHRUST_VALGRIND: "1"

  miri:
    # The runtime's own unsafe (the borrow cell, `sync.rs`) and its
    # threads (the task pool, `task.rs`), and the list holds built on the
    # cell (`seq.rs`), under Miri, which checks their
    # tests for undefined behaviour, data races and leaks, each under
    # eight thread schedules. Slots hold pointers as integers, hence
    # permissive provenance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri && cargo +nightly miri setup
      # Quoted: `sync:: task::` would otherwise read as a YAML mapping.
      - run: "cargo +nightly miri test --locked -p pythrust-rt -- sync:: task:: seq::tests::a_hold seq::tests::a_held_item seq::tests::marked_holds"
        env:
          MIRIFLAGS: "-Zmiri-permissive-provenance -Zmiri-many-seeds=0..8"

  race:
    # Data races in native programs and in the runtime's concurrency
    # tests, under ThreadSanitizer. The runtime and std are instrumented
    # (nightly, `-Zbuild-std`); `--cfg pythrust_tsan` reports each change
    # of an unmarked count or borrow word, and each use of an idle slot's
    # fast path, as the plain write it stands for (`sync.rs`), so two
    # threads using one unmarked value is a reported race.
    # Cranelift's generated code is not instrumented: what it reads and
    # writes itself (module values, the thread's context) is unchecked.
    # `history_size=7` keeps enough of each thread's past accesses that a
    # race against an old one is reported, not dropped for want of its
    # stack. x86-64 Linux only: MSVC has no ThreadSanitizer, and AArch64
    # Linux and macOS are not wired up.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Zsanitizer=thread --cfg pythrust_tsan"
      TSAN_OPTIONS: "halt_on_error=1 history_size=7"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup toolchain install nightly --profile minimal --component rust-src && rustup default stable
      - run: cargo +nightly build --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p pythrust-rt --target-dir "$RUNNER_TEMP/tsan"
      - run: "cargo +nightly test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p pythrust-rt --target-dir $RUNNER_TEMP/tsan --lib -- task:: sync::"
      # The instrumented runtime lives outside `target/`: a build there
      # first would leave `target/` without the `CACHEDIR.TAG` the
      # conformance harness uses to find its own target directory.
      # `ci/tsan-cc` as `cc` links the detector into native programs.
      - run: mkdir -p "$RUNNER_TEMP/tsan-bin" && ln -s "$PWD/ci/tsan-cc" "$RUNNER_TEMP/tsan-bin/cc" && echo "$RUNNER_TEMP/tsan-bin" >> "$GITHUB_PATH"
      # Each task program runs 5 more times pinned to one CPU and 5
      # unpinned: a race shows only on some schedules.
      - run: cargo test --locked --test conformance corpus_matches_native
        env:
          RUSTFLAGS: ""
          PYTHRUST_TSAN: "1"
          PYTHRUST_TSAN_RUNS: "5"
          PYTHRUST_RT: ${{ runner.temp }}/tsan/x86_64-unknown-linux-gnu/debug/libpythrust_rt.a
      # Calibration gate: a runtime that injects the race `PYTHRUST_FAULT`
      # names (the freed-result race of step 4a; values never marked)
      # must be reported, pinned to one CPU, and be clean without it.
      - run: cargo +nightly build --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p pythrust-rt --target-dir "$RUNNER_TEMP/calibrate"
        env:
          RUSTFLAGS: "-Zsanitizer=thread --cfg pythrust_tsan --cfg pythrust_calibrate"
      # Fails unless exactly the gate ran and passed: a renamed gate must
      # not pass as zero tests, and PYTHRUST_CALIBRATE_REQUIRED makes a
      # missing runtime fail it rather than skip it.
      - shell: bash
        run: |
          cargo test --locked --test conformance -- --exact the_race_detector_reports_injected_races 2>&1 | tee "$RUNNER_TEMP/gate.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/gate.log"
        env:
          RUSTFLAGS: ""
          PYTHRUST_CALIBRATE_RT: ${{ runner.temp }}/calibrate/x86_64-unknown-linux-gnu/debug/libpythrust_rt.a
          PYTHRUST_CALIBRATE_REQUIRED: "1"

  rust-version:
    # The oldest toolchain a program calling Rust bindings builds with:
    # every such build compiles `pythrust-rt` with the user's toolchain,
    # so its `rust-version` is checked here by building the probe binding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup toolchain install 1.88.0 --profile minimal && rustup default stable
      - run: cargo build --locked -p pythrust-compiler
      - name: Build the probe binding with Rust 1.88
        run: |
          printf 'import probe\nprint(probe.double(21), probe.half(5.0))\n' > "$RUNNER_TEMP/main.pyr"
          RUSTUP_TOOLCHAIN=1.88.0 ./target/debug/pythrust build --rust probe=crates/pythrust-compiler/tests/rust/probe "$RUNNER_TEMP/main.pyr"
          test "$("$RUNNER_TEMP/main")" = "42 2.5"

  all:
    # One check standing for every job above: it fails unless each
    # succeeded, every `check` platform included. A job that was skipped
    # or cancelled is not a pass. `ci/check_jobs.py` (the "CI jobs"
    # workflow) checks that this list names every job.
    needs: [check, memcheck, miri, race, rust-version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do test "$r" = success; done
          test "$(echo $RESULTS | wc -w)" -eq 5
