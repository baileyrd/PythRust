[package]
name = "pythrust-rt"
description = "Runtime library linked into native Pythrust programs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Every program calling a Rust binding compiles this crate with the
# user's toolchain (`docs/research/rust-interop.md#plumbing`). Its minimum
# matches the compiler and binding resolution target, checked in CI.
rust-version = "1.97"

[lib]
# Linked into every program `pythrust build` compiles: as the staticlib,
# or, for a program calling Rust bindings, as the rlib the generated
# bindings crate depends on.
crate-type = ["staticlib", "rlib"]

[lints.rust]
# Set by CI's race job, which builds this crate under ThreadSanitizer
# (`sync.rs`'s `tsan`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pythrust_tsan)", "cfg(pythrust_calibrate)"] }
