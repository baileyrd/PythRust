[package]
name = "pythrust-rt"
description = "Runtime library linked into native Pythrust programs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Every program calling a Rust binding compiles this crate with the
# user's toolchain (`docs/research/rust-interop.md#plumbing`): 1.88 for
# `<[T]>::as_chunks`. A demonstrated lower bound, built in CI.
rust-version = "1.88"

[lib]
# Linked into every program `pythrust build` compiles: as the staticlib,
# or, for a program calling Rust bindings, as the rlib the generated
# bindings crate depends on.
crate-type = ["staticlib", "rlib"]
